name: Wait How Big social operator

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only validation; publishing is disabled on ephemeral GitHub runners'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: wait-how-big-social-operator
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUFFER_API_KEY: ${{ secrets.WHB_BUFFER_API_KEY }}
      WHB_KILL_SWITCH: ${{ vars.WHB_KILL_SWITCH }}
      # Scheduled runs are always read-only. Explicit false dispatch fails closed in the operator.
      WHB_DRY_RUN: ${{ github.event_name == 'schedule' || inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and unpack reviewed operator
        run: |
          echo '4212083fbcfbad290ce2fd365674fff120229227e6c30df2723ada4dc560722a  wait-how-big-social/operator/operator_bundle.zip' | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/whb-operator"
          unzip -q wait-how-big-social/operator/operator_bundle.zip -d "$RUNNER_TEMP/whb-operator"
          cp wait-how-big-social/operator/state.json "$RUNNER_TEMP/whb-operator/state.json"

      - name: Validate queue without publication
        run: python "$RUNNER_TEMP/whb-operator/whb_operator.py"

      - name: Preserve planned validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whb-read-only-plan-${{ github.run_id }}
          path: ${{ runner.temp }}/whb-operator/plan.json
          if-no-files-found: ignore
          retention-days: 14

      # No post-POST git push, state commit, cache, or artifact is treated as durable intent.
      # Live canaries require the operator's exact grant and durable local host state.
