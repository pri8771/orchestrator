name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The real gate: the stdlib-only engine test suite, run with warnings promoted
  # to errors (the same strict mode the repo has always used locally).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run engine test suite (strict warnings)
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Tests must not mutate the repo (clean-tree guard)
        # git diff catches tracked-file edits; the porcelain check catches
        # NEW untracked files/dirs (the most common test pollution — e.g. a
        # seeded situations/ tree), which git diff is blind to.
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)" || { echo "untracked/modified files after tests:"; git status --porcelain; exit 1; }
      - name: Doctor smoke test (text + JSON)
        run: |
          python orchestrator.py --doctor
          python orchestrator.py --doctor --json | python -c "import json,sys; json.load(sys.stdin)"

  # Lint is advisory for now — the monolith predates the linter, so failures
  # here shouldn't block a green build until it's decomposed.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  # Typecheck is enforcing (no continue-on-error): Round 3's mypy regression
  # slipped through precisely because nothing gated it. One Python version is
  # enough — [tool.mypy] in pyproject.toml pins the target.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[dev]"
      - run: mypy . --config-file pyproject.toml

  # Compile the SwiftUI GUI on macOS. The Python engine has no bearing on this;
  # it catches GUI regressions the Linux jobs can't.
  gui-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: gui/.build
          # gui/Package.resolved doesn't exist today (zero external SPM deps),
          # so hashFiles ignores it; the key only varies with Package.swift
          # until a real dependency is added.
          key: ${{ runner.os }}-spm-${{ hashFiles('gui/Package.swift', 'gui/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Build GUI (release)
        working-directory: gui
        run: swift build -c release
      - name: Run GUI unit tests
        working-directory: gui
        run: swift test
      # The verify.py http-boot Seatbelt tests are @skipUnless(sandbox-exec)
      # — permanently skipped on the ubuntu test jobs, so without this step
      # the one end-to-end proof the sandbox actually denies sensitive writes
      # never runs in CI at all. Runs at the checkout root (tests/ lives
      # there, not under gui/). Scoped to this one module: the rest of the
      # suite is CI-vetted on Linux, not macOS.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sandbox functional tests (sandbox-exec is macOS-only)
        run: python3 -m unittest tests.test_verify_http_sandbox -v
